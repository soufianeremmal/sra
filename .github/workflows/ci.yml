name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Type check
        working-directory: backend
        run: npx tsc --noEmit

      - name: Run tests
        working-directory: backend
        env:
          MONGO_URI: mongodb://localhost:27017/sra_test
          JWT_SECRET: test-secret-for-ci
          SLACK_SAMPLING_CHANNEL: '#test-sampling'
          GMAIL_SAMPLING_ADDRESS: test-sampling@example.com
          SRA_BASE_URL: http://localhost:3000
        run: npm test